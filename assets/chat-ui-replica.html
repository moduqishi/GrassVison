<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>AI 聊天桌面应用 — 一比一复刻</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 1280px; height: 800px; overflow: hidden;
    font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", "Helvetica Neue", sans-serif;
    background: #0a0a0a; color: #fff; display: flex; flex-direction: column;
    font-size: 13px;
  }
  .ico { width: 14px; height: 14px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  button { background: none; border: none; color: inherit; cursor: pointer; font: inherit; }

  /* ══ 顶部 Tab 栏 ══ */
  header { display: flex; align-items: center; height: 44px; border-bottom: 1px solid rgba(255,255,255,.05); padding: 0 12px 0 64px; position: relative; flex-shrink: 0; }
  .lights { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); display: flex; gap: 8px; }
  .lights span { width: 12px; height: 12px; border-radius: 50%; }
  .lights .r { background: #ff5f57; } .lights .y { background: #febc2e; } .lights .g { background: #28c840; }
  .tabs { display: flex; align-items: center; gap: 2px; }
  .tab { display: flex; align-items: center; gap: 6px; padding: 0 12px; height: 32px; border-radius: 8px; font-size: 13px; color: rgba(255,255,255,.6); }
  .tab:hover { background: rgba(255,255,255,.05); }
  .tab.active { background: rgba(255,255,255,.1); color: #fff; }
  .tab-add { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: rgba(255,255,255,.6); }
  .tab-add:hover { background: rgba(255,255,255,.05); }
  .head-right { margin-left: auto; display: flex; align-items: center; gap: 8px; }
  .update-btn { display: flex; align-items: center; gap: 6px; padding: 0 10px; height: 28px; border-radius: 999px; border: 1px solid #22c55e; color: #22c55e; font-size: 12px; }
  .update-btn:hover { background: rgba(34,197,94,.1); }
  .update-btn .ico { width: 14px; height: 14px; }
  .icon-btn { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: rgba(255,255,255,.6); }
  .icon-btn:hover { background: rgba(255,255,255,.05); }

  /* ══ 主体 ══ */
  .body { flex: 1; display: flex; min-height: 0; }

  /* ── 左侧栏 ── */
  aside { width: 260px; flex-shrink: 0; display: flex; flex-direction: column; border-right: 1px solid rgba(255,255,255,.05); background: #0d0d0d; }
  .side-tabs { display: flex; justify-content: center; gap: 24px; height: 44px; align-items: stretch; border-bottom: 1px solid rgba(255,255,255,.05); }
  .side-tab { position: relative; display: flex; align-items: center; font-size: 13px; color: rgba(255,255,255,.5); }
  .side-tab.active { color: #fff; }
  .side-tab.active::after { content: ""; position: absolute; left: 0; right: 0; bottom: -1px; height: 2px; background: #22c55e; border-radius: 2px; }
  .side-tab:hover { color: rgba(255,255,255,.7); }
  .new-topic { display: flex; align-items: center; justify-content: space-between; padding: 10px 12px 8px; }
  .new-topic button { display: flex; align-items: center; gap: 6px; font-size: 12px; color: rgba(255,255,255,.6); }
  .new-topic button:hover { color: #fff; }
  .new-topic .filter { color: rgba(255,255,255,.4); padding: 2px; }
  .new-topic .filter:hover { color: #fff; }
  .topic-list { flex: 1; overflow-y: auto; padding: 0 8px 8px; display: flex; flex-direction: column; gap: 2px; }
  .topic-list::-webkit-scrollbar { width: 0; }
  .topic-item { display: flex; align-items: center; justify-content: space-between; padding: 0 12px; height: 32px; border-radius: 6px; font-size: 13px; }
  .topic-item .txt { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .topic-item .del { color: rgba(255,255,255,.4); opacity: 0; display: flex; }
  .topic-item:hover .del { opacity: 1; }
  .topic-item .del:hover { color: #fff; }
  .topic-item.active { background: rgba(255,255,255,.1); }
  .topic-item.plain { color: rgba(255,255,255,.7); }
  .topic-item.plain:hover { background: rgba(255,255,255,.05); }

  /* ── 主内容 ── */
  main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .assist-bar { display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 16px; border-bottom: 1px solid rgba(255,255,255,.05); }
  .assist-btn { display: flex; align-items: center; gap: 6px; padding: 0 8px; height: 28px; border-radius: 6px; font-size: 13px; }
  .assist-btn:hover { background: rgba(255,255,255,.05); }
  .assist-btn .smile { color: #facc15; }
  .assist-btn .chev { color: rgba(255,255,255,.4); }
  .model-badge { width: 16px; height: 16px; border-radius: 50%; background: #4a9eff; display: flex; align-items: center; justify-content: center; font-size: 10px; font-weight: 700; }
  .bar-right { margin-left: auto; display: flex; gap: 4px; }

  .msgs { flex: 1; overflow-y: auto; padding: 16px; }
  .welcome { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.02); border-radius: 8px; padding: 12px 16px; font-size: 13px; color: rgba(255,255,255,.6); }

  .input-wrap { padding: 16px; }
  .input-box { border: 1px solid rgba(255,255,255,.1); background: rgba(255,255,255,.02); border-radius: 16px; padding: 12px 16px; }
  .input-box input { width: 100%; background: transparent; border: none; outline: none; color: #fff; font-size: 13px; font-family: inherit; }
  .input-box input::placeholder { color: rgba(255,255,255,.3); }
  .toolbar { display: flex; align-items: center; gap: 4px; margin-top: 12px; }
  .tool { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; color: rgba(255,255,255,.6); }
  .tool:hover { background: rgba(255,255,255,.05); color: #fff; }
  .tool .ico { width: 15px; height: 15px; }
  .sep { width: 1px; height: 16px; background: rgba(255,255,255,.1); margin: 0 4px; }
  .tool-right { margin-left: auto; display: flex; align-items: center; gap: 4px; }
  .send { width: 28px; height: 28px; display: flex; align-items: center; justify-content: center; border-radius: 6px; background: rgba(255,255,255,.1); }
  .send:hover { background: rgba(255,255,255,.2); }
</style>
</head>
<body>
  <!-- ══ 顶部 Tab 栏 ══ -->
  <header>
    <div class="lights"><span class="r"></span><span class="y"></span><span class="g"></span></div>
    <div class="tabs">
      <button class="tab active">
        <svg class="ico" viewBox="0 0 24 24"><path d="M3 9.5L12 3l9 6.5V21a1 1 0 0 1-1 1h-5v-7h-6v7H4a1 1 0 0 1-1-1z"/></svg>
        首页
      </button>
      <button class="tab">
        <svg class="ico" viewBox="0 0 24 24"><path d="M12 3l1.9 5.8L19.7 10l-5.8 1.9L12 17.7l-1.9-5.8L4.3 10l5.8-1.9z"/><path d="M19 15l.9 2.7 2.7.9-2.7.9L19 22.2l-.9-2.7-2.7-.9 2.7-.9z"/></svg>
        智能体
      </button>
      <button class="tab-add"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    </div>
    <div class="head-right">
      <button class="update-btn">
        <svg class="ico" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36M21 3v6h-6"/></svg>
        有可用更新
      </button>
      <button class="icon-btn"><svg class="ico" viewBox="0 0 24 24"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg></button>
      <button class="icon-btn"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></button>
    </div>
  </header>

  <div class="body">
    <!-- ══ 左侧栏 ══ -->
    <aside>
      <div class="side-tabs">
        <button class="side-tab">助手</button>
        <button class="side-tab active">话题</button>
      </div>
      <div class="new-topic">
        <button><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>新建话题</button>
        <button class="filter"><svg class="ico" viewBox="0 0 24 24"><path d="M3 6h18M7 12h10M10 18h4"/></svg></button>
      </div>
      <div class="topic-list">
        <div class="topic-item active"><span class="txt">默认话题</span><span class="del"><svg class="ico" viewBox="0 0 24 24"><path d="M18 6L6 18M6 6l12 12"/></svg></span></div>
        <button class="topic-item plain"><span class="txt">分析图片</span></button>
        <button class="topic-item plain"><span class="txt">你好</span></button>
        <button class="topic-item plain"><span class="txt">你好吗</span></button>
        <button class="topic-item plain"><span class="txt">你好吗</span></button>
        <button class="topic-item plain"><span class="txt">你好</span></button>
        <button class="topic-item plain"><span class="txt">你好</span></button>
        <button class="topic-item plain"><span class="txt">你好吗</span></button>
        <button class="topic-item plain"><span class="txt">识别课表</span></button>
        <button class="topic-item plain"><span class="txt">你好吗</span></button>
        <button class="topic-item plain"><span class="txt">你好</span></button>
      </div>
    </aside>

    <!-- ══ 主内容 ══ -->
    <main>
      <div class="assist-bar">
        <button class="icon-btn"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
        <button class="assist-btn">
          <svg class="ico smile" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M8 14s1.5 2 4 2 4-2 4-2M9 9h.01M15 9h.01"/></svg>
          <span>默认助手</span>
          <svg class="ico chev" viewBox="0 0 24 24"><path d="M9 18l6-6-6-6"/></svg>
        </button>
        <button class="assist-btn">
          <span class="model-badge">D</span>
          <span>deepseek-v4-flash-vision | cli</span>
          <svg class="ico chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="bar-right">
          <button class="icon-btn"><svg class="ico" viewBox="0 0 24 24"><path d="M22 3H2l8 9.46V19l4 2v-8.54z"/></svg></button>
          <button class="icon-btn"><svg class="ico" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4-4"/></svg></button>
        </div>
      </div>

      <div class="msgs">
        <div class="welcome">你好，我是默认助手。你可以立刻开始跟我聊天</div>
      </div>

      <div class="input-wrap">
        <div class="input-box">
          <input placeholder="在这里输入消息，按 Enter 发送">
          <div class="toolbar">
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><path d="M18.37 2.63L14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2.12 2.12 0 1 0-3-3z"/><path d="M9 8c-2 3-4 3.5-7 4l8 10c2-1 6-5 6-7"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-3.92 7.94"/></svg></button>
            <span class="sep"></span>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><path d="M12 22v-5M9 8V2M15 8V2M18 8v5a4 4 0 0 1-4 4h-4a4 4 0 0 1-4-4V8z"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><path d="M16 18l6-6-6-6M8 6l-6 6 6 6"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><path d="M7 21h10M11 21l8-8-6-6-8 8zM5 11l8 8"/></svg></button>
            <button class="tool"><svg class="ico" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/></svg></button>
            <div class="tool-right">
              <button class="tool"><svg class="ico" viewBox="0 0 24 24"><path d="M5 8l6 6M4 14l6-6 2-3M2 5h12M7 2h1"/></svg></button>
              <button class="send"><svg class="ico" viewBox="0 0 24 24"><path d="M12 19V5M5 12l7-7 7 7"/></svg></button>
            </div>
          </div>
        </div>
      </div>
    </main>
  </div>
</body>
</html>
