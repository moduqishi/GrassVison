<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录 - GrassVision</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%2310b981'/%3E%3Ctext x='16' y='22' font-size='17' text-anchor='middle'%3E🌿%3C/text%3E%3C/svg%3E">
    <link rel="stylesheet" href="/static/css/admin.css?v={{ css_version or 1 }}">
</head>
<body class="login-body">
    <div class="login-card">
        <div class="login-brand">
            <div class="brand-logo">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M11 20A7 7 0 0 1 9.8 6.1C15.5 5 17 4.48 19 2c1 2 2 4.18 2 8 0 5.5-4.78 10-10 10z"/><path d="M2 21c0-3 1.85-5.36 5.08-6C9.5 14.52 12 13 13 12"/>
                </svg>
            </div>
            <div class="login-title">GrassVision</div>
            <div class="login-sub">图像增强网关 · 管理后台</div>
        </div>

        <form id="loginForm" onsubmit="doLogin(event)">
            <div class="form-group">
                <label>用户名</label>
                <input type="text" name="username" value="admin" class="input" autocomplete="username" required>
            </div>
            <div class="form-group">
                <label>密码</label>
                <input type="password" name="password" class="input" autocomplete="current-password" required autofocus placeholder="请输入密码">
            </div>
            <div id="loginError" class="error-msg" style="display:none;background:var(--danger-soft);color:var(--danger-text);padding:9px 12px;border-radius:9px;font-size:13px;margin-bottom:14px"></div>
            <button type="submit" id="loginBtn" class="btn btn-primary btn-full" style="padding:10px;font-size:14px">
                <span id="loginBtnText">登 录</span>
            </button>
        </form>

        <p style="text-align:center;margin-top:20px;font-size:12px;color:var(--text-4)">
            🌿 为纯文本大模型赋予图像理解能力
        </p>
    </div>

    <script>
        async function doLogin(e) {
            e.preventDefault();
            const btn = document.getElementById('loginBtn');
            const btnText = document.getElementById('loginBtnText');
            const err = document.getElementById('loginError');
            err.style.display = 'none';
            btn.disabled = true;
            btnText.textContent = '登录中…';
            try {
                const fd = new FormData(e.target);
                const r = await fetch('/api/admin/login', { method: 'POST', body: fd });
                const data = await r.json();
                if (data.ok) {
                    window.location.href = '/admin/dashboard';
                    return;
                }
                throw new Error(data.error || '登录失败');
            } catch (ex) {
                err.textContent = ex.message || '登录失败，请检查用户名和密码';
                err.style.display = 'block';
            } finally {
                btn.disabled = false;
                btnText.textContent = '登 录';
            }
        }
    </script>
</body>
</html>
