{% extends "base.html" %}
{% block title %}源渠道管理{% endblock %}
{% block content %}
<div x-data="sourceProviders()" x-init="init()">
    <div class="page-head">
        <div>
            <h1>源渠道管理</h1>
            <div class="sub">对接 DeepSeek 等纯文本模型上游，为增强模型提供推理能力。</div>
        </div>
        <div class="page-head-actions">
            <button class="btn btn-primary" @click="openCreate()">
                <svg class="icon"><use href="#i-plus"/></svg>新增渠道
            </button>
        </div>
    </div>

    <div class="card">
        <div class="card-head">
            <svg class="icon"><use href="#i-link"/></svg>
            <div>
                <div class="card-title">源渠道列表</div>
                <div class="card-title-sub" x-text="Object.keys(providers).length + ' 个渠道'"></div>
            </div>
        </div>
        <div class="table-wrap">
            <table class="data-table">
                <thead>
                    <tr><th>名称</th><th>ID</th><th>Base URL</th><th>超时</th><th>状态</th><th style="text-align:right">操作</th></tr>
                </thead>
                <tbody>
                    <template x-for="(p, key) in providers" :key="key">
                        <tr>
                            <td class="cell-primary" x-text="p.name || key"></td>
                            <td><code class="inline" x-text="key"></code></td>
                            <td>
                                <div class="flex-center" style="gap:6px">
                                    <code class="inline cell-truncate" style="max-width:240px" x-text="p.base_url"></code>
                                    <button class="icon-btn" style="width:26px;height:26px" @click="gvCopy(p.base_url, 'Base URL 已复制')" title="复制">
                                        <svg class="icon icon-sm"><use href="#i-copy"/></svg>
                                    </button>
                                </div>
                            </td>
                            <td x-text="p.timeout + 's'"></td>
                            <td>
                                <span class="badge" :class="p.enabled ? 'badge-success' : 'badge-muted'">
                                    <span class="dot" x-show="p.enabled"></span><span x-text="p.enabled ? '启用' : '禁用'"></span>
                                </span>
                            </td>
                            <td>
                                <div class="actions" style="justify-content:flex-end">
                                    <button class="btn btn-sm btn-outline" @click="testProvider(key, $el)" :disabled="testingKey===key">
                                        <svg class="icon" x-show="testingKey!==key"><use href="#i-activity"/></svg>
                                        <span class="spinner" x-show="testingKey===key" style="border-color:rgba(16,185,129,.3);border-top-color:#10b981"></span>
                                        <span x-text="testingKey===key ? '测试中' : '测试'"></span>
                                    </button>
                                    <button class="btn btn-sm btn-outline" @click="editProvider(key, p)">
                                        <svg class="icon"><use href="#i-edit"/></svg>编辑
                                    </button>
                                    <button class="btn btn-sm btn-danger-ghost" @click="deleteProvider(key)">
                                        <svg class="icon"><use href="#i-trash"/></svg>删除
                                    </button>
                                </div>
                            </td>
                        </tr>
                    </template>
                    <tr x-show="Object.keys(providers).length === 0">
                        <td colspan="6">
                            <div class="empty">
                                <div class="empty-icon"><svg class="icon"><use href="#i-link"/></svg></div>
                                <div class="empty-title">还没有源渠道</div>
                                <div class="empty-desc">点击右上角「新增渠道」，添加你的文本模型上游，例如 DeepSeek Chat。</div>
                                <button class="btn btn-primary mt-12" @click="openCreate()">
                                    <svg class="icon"><use href="#i-plus"/></svg>新增第一个渠道
                                </button>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>

    <!-- Create / Edit modal -->
    <div class="modal-overlay" x-show="showModal" x-cloak @click.self="showModal=false">
        <div class="modal">
            <div class="modal-head">
                <div class="modal-icon"><svg class="icon"><use href="#i-link"/></svg></div>
                <div>
                    <div class="modal-title" x-text="editing ? '编辑源渠道' : '新增源渠道'"></div>
                    <div class="modal-sub" x-text="editing ? form.key : '配置一个文本模型上游'"></div>
                </div>
                <button class="modal-close" @click="showModal=false"><svg class="icon"><use href="#i-x"/></svg></button>
            </div>
            <form @submit.prevent="saveProvider()">
                <div class="modal-body">
                    <div class="form-group">
                        <label class="label-req">渠道 ID</label>
                        <input class="input" x-model="form.key" :disabled="editing" placeholder="例如 deepseek" required x-ref="firstInput">
                        <p class="hint" x-show="!editing">唯一标识，创建后不可修改。</p>
                    </div>
                    <div class="form-group">
                        <label>渠道名称</label>
                        <input class="input" x-model="form.name" placeholder="例如 DeepSeek 官方">
                    </div>
                    <div class="form-group">
                        <label class="label-req">Base URL</label>
                        <input class="input" x-model="form.base_url" placeholder="https://api.deepseek.com/v1" required>
                    </div>
                    <div class="form-group">
                        <label>API Key <span class="text-muted" style="font-weight:400" x-text="editing ? '（留空不修改）' : ''"></span></label>
                        <input class="input" x-model="form.api_key" type="password" placeholder="sk-..." autocomplete="new-password">
                    </div>
                    <div class="form-group" style="margin-bottom:4px">
                        <label>超时时间（秒）</label>
                        <input class="input" x-model.number="form.timeout" type="number" min="1">
                    </div>
                    <div class="switch-row">
                        <div>
                            <div class="switch-label">启用渠道</div>
                            <div class="switch-desc">关闭后该渠道不可用</div>
                        </div>
                        <label class="switch"><input type="checkbox" x-model="form.enabled"><span class="track"></span></label>
                    </div>
                </div>
                <div class="modal-foot">
                    <button type="button" class="btn btn-ghost" @click="showModal=false">取消</button>
                    <button type="submit" class="btn btn-primary">
                        <svg class="icon"><use href="#i-check"/></svg><span x-text="editing ? '保存修改' : '创建渠道'"></span>
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
function sourceProviders() {
    return {
        providers:{}, showModal:false, editing:false, testingKey:null,
        form:{key:'',name:'',base_url:'',api_key:'',timeout:120,enabled:true},
        async init(){ const d=await api('GET','/api/admin/source-providers'); this.providers=d.providers||{}; },
        openCreate(){
            this.editing=false;
            this.form={key:'',name:'',base_url:'',api_key:'',timeout:120,enabled:true};
            this.showModal=true;
            this.$nextTick(()=>{ if(this.$refs.firstInput) this.$refs.firstInput.focus(); });
        },
        editProvider(key,p){
            this.editing=true;
            this.form={key,...p,api_key:''};
            this.showModal=true;
        },
        async saveProvider(){
            if(!this.form.key.trim()) return showToast('渠道 ID 不能为空','error');
            const m=this.editing?'PUT':'POST';
            const u=this.editing?`/api/admin/source-providers/${this.form.key}`:'/api/admin/source-providers';
            try {
                await api(m,u,this.form);
                this.showModal=false;
                showToast(this.editing?'渠道已更新':'渠道已创建');
                location.reload();
            } catch(e) { showToast(e.message||'保存失败','error'); }
        },
        async deleteProvider(key){
            if(!(await gvConfirm(`确定删除源渠道「${key}」？此操作不可撤销。`))) return;
            try {
                await api('DELETE',`/api/admin/source-providers/${key}`);
                showToast('渠道已删除');
                location.reload();
            } catch(e) { showToast(e.message,'error'); }
        },
        async testProvider(key, btn){
            if(this.testingKey) return;
            this.testingKey=key;
            try {
                const r=await fetch(`/api/admin/source-providers/${key}/test`,{method:'POST'});
                const d=await r.json();
                if(d.ok) showToast(`「${key}」连接测试通过`);
                else showToast(`「${key}」测试失败: ${d.result?.error||'未知错误'}`,'error');
            } catch(e) { showToast('测试出错: '+e.message,'error'); }
            this.testingKey=null;
        }
    }
}
</script>
{% endblock %}
