# GrassVision 配置示例
# 复制此文件为 config.yaml 并按需修改
server:
  host: 127.0.0.1
  port: 8042
  access_key: ''
  request_timeout: 600

admin:
  enabled: true
  username: admin
  password: admin123

source_providers:
  cpa:
    name: cpa
    enabled: true
    base_url: https://api.555615.xyz/v1
    api_key: sk-your-api-key
    timeout: 999999999999999
    headers: {}

vision_providers:
  vivo:
    name: vivo
    enabled: true
    base_url: https://api-ai.vivo.com.cn/v1
    api_key: sk-your-vivo-api-key
    model: Doubao-Seed-2.0-mini
    timeout: 1000000000000000
    max_images: 1000000000000000
    max_image_size_mb: 1000000000000000
    image_detail: ''
    extra_params: {}
    headers: {}

models:
  deepseek-v4-flash-vision:
    name: deepseek-v4-flash-vision
    enabled: true
    source_provider: cpa
    source_model: deepseek-v4-flash
    vision_enabled: true
    vision_provider: vivo
    vision_model: ''
    vision_prompt: prompts/default.txt
    vision_failure_mode: error
    replace_response_model: true
    cache_prompt: null
    # 视觉渠道故障转移：主渠道失败时按序尝试（渠道 key 列表）
    vision_provider_failover: []
  deepseek-v4-pro-vision:
    name: deepseek-v4-pro-vision
    enabled: true
    source_provider: cpa
    source_model: deepseek-v4-pro
    vision_enabled: true
    vision_provider: vivo
    vision_model: ''
    vision_prompt: prompts/default.txt
    vision_failure_mode: error
    replace_response_model: true
    cache_prompt: null
  glm-5.2-vision:
    name: glm-5.2-vision
    enabled: true
    source_provider: cpa
    source_model: glm-5.2
    vision_enabled: true
    vision_provider: vivo
    vision_model: ''
    vision_prompt: prompts/default.txt
    vision_failure_mode: error
    replace_response_model: true
    cache_prompt: null

image:
  max_images: 1000000000000000
  max_image_size_mb: 1000000000000000
  max_total_size_mb: 1000000000000000
  max_width: 1000000000000000
  max_height: 1000000000000000
  download_timeout: 20
  allow_private_network: false
  # 多图策略：independent=逐图独立分析 | auto=对比意图时联合一次调用 | combined=多图总是联合
  multi_image_mode: independent
  analysis_scope: latest_user_message
  historical_cache_miss: drop
  thinking_guidance: false
  stream_vision_thinking: false
  # 流式视觉阶段预提示：false=首帧即真实思考链（默认）；true=先推"正在处理图片"占位
  vision_stream_prelude: false
  # 通道说明：告诉源模型收到的是文字分析不是像素，细节不足时引导用户重发图触发重分析
  vision_channel_note: false
  comparison_strategy: source_model
  # 问题感知缓存：视觉模型直接收到用户问题，缓存键随问题变化（针对性更强、命中率下降）
  question_aware_cache: false
  # 历史图片缓存复用：纯文字追问上一轮图片时，缓存命中的描述原地注入（不触发新分析）
  reuse_historical_cache: false
  # 多图并发分析并发度上限
  vision_concurrency: 4
  # 长截图切片 OCR：高宽比≥3 且高度≥1800px 的截图自动分段分析后合并
  long_screenshot_ocr: false
  # 定位-放大-再读：问题针对具体 UI 元素时先定位坐标框，再裁剪放大二次精读
  grounding_zoom: false
  # 协议化服务端重看：注入 view_image 工具，源模型自主调用，服务端用请求内图片重新分析
  vision_reexamine: false
  # 结构化证据输出：视觉模型返回 JSON 证据，格式化注入（不确定项单独标注）
  structured_evidence: false
  # 本地像素工具（服务端无感）：精确色值/像素差异/几何矢量化（grassvision_pixel_* 工具）
  pixel_tools: false
  vision_cache:
    enabled: true
    ttl_seconds: 3600
    max_entries: 200
    default_prompt: prompts/cache.txt

logging:
  level: INFO
  save_to_file: true
  file: logs/grassvision.log
  log_request_body: false
  log_vision_result: false
